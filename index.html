<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Her A–Z: women's health, explained plainly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFAFB; --surface:#FFFFFF; --ink:#2B2230; --muted:#7A6B78; --line:#FBE6EC;
  --accent:#D0356A; --accent-ink:#FFFFFF; --accent-soft:#FFEDF2;
  --sage:#DDEBE3; --sage-ink:#2F5A47;
  --alert:#FBE9E5; --alert-ink:#8E2F20; --alert-line:#E9B8AE; --amber:#FFF1D6; --amber-ink:#7A4B00; --amber-line:#EBCB8F;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media not all{
  :root:not([data-theme="light"]){
    --bg:#1F1218; --surface:#2A1A22; --ink:#FBEAF0; --muted:#C9A5B4; --line:#433039;
    --accent:#FF8FAE; --accent-ink:#2B0F1B; --accent-soft:#3D2230;
    --sage:#1F2E27; --sage-ink:#9ED2B6;
    --alert:#3A1E1A; --alert-ink:#FFB4A5; --alert-line:#6A3329; --amber:#33270F; --amber-ink:#F3CF8B; --amber-line:#6B5222;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1218; --surface:#2A1A22; --ink:#FBEAF0; --muted:#C9A5B4; --line:#433039;
  --accent:#FF8FAE; --accent-ink:#2B0F1B; --accent-soft:#3D2230;
  --sage:#1F2E27; --sage-ink:#9ED2B6;
  --alert:#3A1E1A; --alert-ink:#FFB4A5; --alert-line:#6A3329; --amber:#33270F; --amber-ink:#F3CF8B; --amber-line:#6B5222;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;letter-spacing:-0.01em}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 110px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:22px}
.brand i{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:var(--accent);display:inline-block}
.tag{font-family:var(--display);font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font-family:var(--display);font-weight:500;font-size:16px;border-radius:999px;border:1.5px solid var(--accent);padding:13px 22px;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.small{padding:8px 16px;min-height:40px;font-size:14px}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-family:var(--display);font-size:15px}
.stack>*+*{margin-top:14px}

/* onboarding */
.ob h1{font-size:34px;margin-bottom:12px}
.ob p.lead{font-size:18px;color:var(--muted);margin:0 0 24px}
.opts{display:grid;gap:10px;margin-bottom:22px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--display);font-size:17px;font-weight:500;min-height:52px}
.opt small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.privacy{font-size:14px;color:var(--muted);background:var(--sage);color:var(--sage-ink);border-radius:12px;padding:12px 14px;margin:0 0 22px}

/* home */
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{margin:0 0 18px;color:var(--muted)}
.search{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sec{margin-top:30px}
.sec h2{font-size:21px;margin-bottom:12px}
.sec .sub{font-size:14px;color:var(--muted);margin:-6px 0 12px}

/* life-stage ribbon: the memorable element */
.ribbon{position:relative;display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px;margin:0 -18px;padding-left:18px;padding-right:18px;scroll-snap-type:x proximity}
.ribbon::before{content:"";position:absolute;left:18px;right:18px;top:26px;height:2px;background:var(--line)}
.stage{position:relative;flex:0 0 132px;scroll-snap-align:start;background:none;border:0;text-align:left;padding:0 10px 0 0}
.stage .dot{display:block;width:40px;height:40px;border-radius:50%;background:var(--bg);border:2px solid var(--line);margin-bottom:10px;position:relative;z-index:1;transition:background .15s,border-color .15s}
.stage .dot::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--line);transition:background .15s}
.stage b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.stage span.d{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:3px}
.stage[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent-soft)}
.stage[aria-pressed="true"] .dot::after{background:var(--accent)}
.stage[aria-pressed="true"] b{color:var(--accent)}

.list{display:grid;gap:10px}
.row{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row:hover{border-color:var(--accent)}
.row .t{display:block;font-family:var(--display);font-weight:700;font-size:18px}
.row .s{display:block;font-size:15px;color:var(--muted);margin-top:3px;line-height:1.45}
.row .meta{display:inline-block;margin-top:8px;font-family:var(--display);font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;margin-right:6px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:14.5px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;text-decoration:none;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:14px;color:var(--muted);margin-top:10px}

/* entry */
.back{background:none;border:0;padding:8px 0;margin-bottom:8px;font-family:var(--display);color:var(--muted);font-size:15px}
.entry h1{font-size:36px;margin-bottom:4px}
.aka{color:var(--muted);font-size:15px;margin-bottom:12px}
.draft{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0 18px;font-family:var(--display)}
.lead{font-size:19px;line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.entry section{margin-top:28px}
.entry h2{font-size:22px;margin-bottom:10px}
.entry ul{padding-left:22px;margin:0}
.entry li{margin-bottom:8px;max-width:62ch}
.entry p{max-width:62ch;margin:0 0 10px}
.urgent{background:var(--alert);border:1.5px solid var(--alert-line);color:var(--alert-ink);border-radius:14px;padding:16px 18px}
.urgent h2{color:var(--alert-ink)}
.sources a{color:var(--accent)}
.disclaimer{font-size:13.5px;color:var(--muted);margin-top:34px;border-top:1px solid var(--line);padding-top:14px}

/* A-Z */
.az-letter{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);margin:22px 0 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:680px}
.tab{flex:1;background:none;border:0;padding:10px 4px 9px;font-family:var(--display);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--display);font-size:14px;z-index:9}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* v2 additions */
.tab{font-size:11.5px;padding-left:2px;padding-right:2px}
.cards{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:22px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{display:block;text-decoration:none;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px}
.card:nth-child(2){background:var(--sage);color:var(--sage-ink)}
.card b{display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.card span{font-size:14.5px;line-height:1.4;display:block}
.sr{position:absolute;left:-9999px}
.chatlog{display:grid;gap:12px;margin:16px 0}
.msg{max-width:94%;border-radius:16px;padding:12px 14px}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
.msg.user{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:100%;width:100%}
.askform textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.askbtns{display:flex;gap:14px;align-items:center;margin-top:10px}
.flag{border-radius:14px;padding:12px 14px;margin:10px 0;border:1.5px solid var(--alert-line);background:var(--alert);color:var(--alert-ink)}
.flag b{font-family:var(--display)}.flag p{margin:4px 0 0;font-size:15px}
.flag.soon{background:var(--amber);border-color:var(--amber-line);color:var(--amber-ink)}
.bot-note{font-size:14px;color:var(--muted)}
.row.res .t{text-decoration:none}
.row.res a.t{color:inherit}
.meta.fit{background:var(--sage);color:var(--sage-ink)}
.meta.rare{background:var(--amber);color:var(--amber-ink)}
.why{font-size:13.5px}
.care{background:var(--sage);color:var(--sage-ink);border-radius:14px;padding:12px 16px;margin:14px 0}
.care ul{margin:6px 0 0;padding-left:20px}.care li{margin-bottom:6px;font-size:15.5px}
.prep{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.prep summary{cursor:pointer;font-family:var(--display);font-weight:500}
.prep textarea{width:100%;font:inherit;font-size:14px;margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.badge{display:inline-block;font-family:var(--display);font-size:12.5px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.r-strong{background:var(--sage);color:var(--sage-ink)}
.r-mod{background:var(--accent-soft);color:var(--accent)}
.r-lim{background:var(--amber);color:var(--amber-ink)}
.r-weak{background:var(--alert);color:var(--alert-ink)}
.legend>div{margin-bottom:8px;font-size:15px}
.supps{display:grid;gap:10px}
.supp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.supp summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;list-style:none}
.supp summary::-webkit-details-marker{display:none}
.sname{font-family:var(--display);font-weight:700;font-size:18px}
.sbody{padding-bottom:14px}.sbody h3{font-size:15px;margin:14px 0 4px;color:var(--accent)}.sbody p{margin:0 0 6px;font-size:16px}
.rnote{font-style:italic;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.jump a{font-family:var(--display);font-size:14px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--accent)}
</style>

 symptoms:['Pelvic pain, often worse around your period','Painful periods that get in the way of daily life','Pain during or after sex','Pain when going to the toilet during your period','Heavy periods','Feeling very tired','Bloating or feeling sick','Difficulty getting pregnant','Symptoms vary a lot. Some people have very few, even with widespread endometriosis.'],

 summary:'Gestational diabetes is high blood sugar that develops during pregnancy. It happens when your body can\'t make enough insulin to meet the extra needs of pregnancy. It usually goes away after the baby is born, and with good care most people go on to have healthy pregnancies.',

 causes:['Hormones from the placenta can make it harder for insulin to work.','Some things raise the chance: a high body mass index, gestational diabetes in a previous pregnancy, a close relative with diabetes, a previous large baby, and certain family backgrounds (for example South Asian, Black Caribbean or Middle Eastern).','Having risk factors doesn\'t mean you will develop it, and it can happen without any.'],
 diagnosis:['If you\'re at higher risk, you\'ll usually be offered a glucose tolerance test at around 24 to 28 weeks, sometimes earlier.','The test involves a fasting blood sample, a sugary drink, and another blood sample about two hours later.'],
 manage:['Eating a balanced diet and being active can help control blood sugar.','You\'ll be shown how to check your own blood sugar levels with a finger-prick test.','Some people need medicine (metformin or insulin) if lifestyle changes aren\'t enough.','Extra antenatal checks and scans are common to monitor you and your baby.','After the birth, you\'ll be offered a blood test to check your sugar levels, and ongoing yearly checks, because the chance of type 2 diabetes later is higher.'],
 ask:['What range should my blood sugar levels stay within?','Will I need medicine, and what are the options?','How will this affect where and how I give birth?','What follow-up testing will I have after my baby is born?'],
 urgent:['Extreme thirst, vomiting, or feeling very unwell, drowsy or confused','Reduced baby movements: contact your maternity unit immediately'],
 src:['nhs','nice','dukk']},
{id:'pre-eclampsia',name:'Pre-eclampsia',aka:'High blood pressure condition in pregnancy',
 short:'A pregnancy condition with high blood pressure and signs that organs, like the kidneys, are affected.',
 stages:['preg'],areas:['preg','heart'],
 tags:['Headache','Swelling'],
 summary:'Pre-eclampsia is a condition that usually develops after 20 weeks of pregnancy. It involves high blood pressure and signs that other organs, such as the kidneys or liver, aren\'t working as they should. It can also develop shortly after birth. Most cases are picked up and managed well with regular antenatal checks.',
 symptoms:['A severe headache that doesn\'t go away','Problems with vision, such as blurring, flashing lights or spots','Pain just below the ribs, usually on the right side','Sudden swelling of the face, hands or feet','Feeling sick or vomiting, especially later in pregnancy','Early pre-eclampsia often has no symptoms, and the first sign is raised blood pressure at a routine check.'],
 causes:['The exact cause isn\'t fully understood. It is thought to involve how the placenta develops early in pregnancy.','You may be at higher risk if you\'ve had pre-eclampsia before, have high blood pressure, kidney disease or diabetes, are expecting twins or more, are over 40, or have a high body mass index.'],
 diagnosis:['Blood pressure and urine are checked at antenatal appointments.','If readings are raised, you may have blood tests, extra monitoring and scans of your baby.'],
 manage:['Regular monitoring of your blood pressure, blood tests and baby\'s growth.','Medicines to lower blood pressure.','If you\'re at higher risk, you may be advised to take low-dose aspirin from early pregnancy. Only start this if a doctor or midwife recommends it.','The only cure is delivery of the baby and placenta. Doctors weigh the risks to you and the baby to decide the best time, which can mean an earlier delivery.','Blood pressure is checked after birth because pre-eclampsia can develop or continue for several weeks afterwards.'],
 ask:['Am I at higher risk, and should I take aspirin?','How often will my blood pressure be checked?','Which symptoms should make me call the maternity unit straight away?','How might this affect when and how I give birth?'],
 urgent:['Severe headache, vision changes, severe pain under your ribs or sudden swelling: contact your maternity unit or call 111 straight away','Call 999 if you have a fit (seizure), difficulty breathing or collapse'],
 src:['nhs','nice','act']}

X('adenomyosis','Adenomyosis','When womb lining tissue grows into the womb wall',
"Tissue like the womb lining grows into the muscle wall of the womb, causing heavy, painful periods.",
['repro','meno'],['repro'],['Heavy periods','Painful periods','Pelvic pain','Bloating'],
"Adenomyosis is a condition where tissue similar to the womb lining grows into the muscular wall of the womb. It is most often diagnosed in people in their 30s and 40s, and it can overlap with endometriosis and fibroids. Some people have no symptoms at all.",
["Heavy periods","Painful periods that may get worse over time","Pain in the lower tummy or pelvis","Pain during sex","Bloating or a tender, swollen lower tummy","Bleeding between periods","Some people have no symptoms"],
["The cause isn't known.","It's more common in people who have had children, previous womb surgery (such as a caesarean), or who are in their 30s and 40s.","Hormones, especially oestrogen, are thought to play a part."],
["A GP may examine you and ask about your periods and pain.","A pelvic ultrasound or MRI scan can show changes in the womb wall.","In the past it was often only confirmed after a hysterectomy, but scans are now used more often."],
["Painkillers such as anti-inflammatories can ease pain.","Tranexamic acid can reduce heavy bleeding.","A hormonal coil (levonorgestrel IUS) or the contraceptive pill can reduce bleeding and pain.","If symptoms are severe and you've completed your family, a hysterectomy is a definitive treatment.","Adenomyosis usually improves after menopause, as hormone levels fall."],
["Could my heavy or painful periods be adenomyosis, fibroids or something else?","Which scan is most useful for me?","Would a hormonal coil suit me?","How might this affect my plans to have children?"],
["Bleeding so heavy that you soak through pads or tampons every hour","Sudden, severe pelvic pain, especially with fainting or fever"],
['nhs','nice','rcog']),

X('iron-deficiency-anaemia','Iron-deficiency anaemia','Low iron causing tiredness',
"Not enough iron to make healthy red blood cells, often caused by heavy periods or pregnancy.",
['teen','repro','preg','meno'],['horm'],['Fatigue','Dizziness','Heavy periods'],
"Iron-deficiency anaemia happens when your body doesn't have enough iron to make haemoglobin, the part of red blood cells that carries oxygen. It is common in women, especially with heavy periods or during pregnancy. It is treatable, but it's important to find out why iron is low.",
["Feeling very tired or weak","Looking pale","Shortness of breath, especially on exertion","Headaches or dizziness","A fast or noticeable heartbeat (palpitations)","Hair loss, brittle nails or a sore tongue","Cravings to eat non-food items such as ice (called pica)"],
["Heavy periods are the most common cause in women who haven't reached menopause.","Pregnancy increases the amount of iron you need.","Not getting enough iron from food, for example on a restrictive or vegan diet without planning.","Conditions that affect absorption, such as coeliac disease, or bleeding from the gut."],
["A blood test (full blood count and ferritin) shows whether you're anaemic and how low your iron stores are.","If iron is low, your doctor will usually look for the cause, including asking about periods and diet."],
["Iron tablets are usually taken for several months to rebuild stores. The dose and type should come from a doctor or pharmacist.","Taking iron with vitamin C (for example orange juice) may help absorption, while tea and coffee can reduce it.","Iron tablets can cause constipation and dark stools. Tell your doctor if they upset your stomach, as there are other options.","Treating the cause, such as heavy periods, matters as much as taking iron.","In some cases iron is given by infusion."],
["Is my iron low, and why?","How long should I take iron tablets and when will I be re-tested?","Could my heavy periods be treated?","Do I need other tests, for example for coeliac disease?"],
["Chest pain, severe breathlessness, fainting or a racing heartbeat that doesn't settle","Black, tarry stools or vomiting blood"],
['nhs','nice','rcog']),

X('bacterial-vaginosis','Bacterial vaginosis (BV)','A common vaginal imbalance, not an infection you catch',
"A change in the balance of vaginal bacteria causing thin discharge and a fishy smell.",
['teen','repro','preg','meno'],['repro'],['Unusual discharge','Fishy smell'],
"Bacterial vaginosis (BV) is the most common cause of unusual vaginal discharge in women of reproductive age. It happens when the balance of bacteria in the vagina changes. It isn't a sexually transmitted infection, though it's linked to sexual activity and can come back.",
["Thin, white or grey discharge","A fishy smell, often stronger after sex or during your period","Usually no itching or soreness (which helps tell it apart from thrush)","Some people have no symptoms"],
["It happens when 'good' lactobacilli bacteria fall and other bacteria overgrow.","It's linked to a change in sexual partner, having an IUD (coil), smoking, and washing inside the vagina (douching) or using scented products."],
["A doctor, nurse or sexual health clinic can take a swab or check the acidity (pH) of your vagina.","It's worth testing rather than guessing, because BV and thrush need different treatments."],
["Antibiotics, such as metronidazole or clindamycin, given as tablets, gel or cream.","Avoid douching, scented soaps, bubble baths and vaginal deodorants.","BV often returns. If it keeps coming back, ask about longer or different treatment.","If you're pregnant, tell your midwife or GP, because treatment may be recommended."],
["Is this BV, thrush or something else?","What can I do to stop it coming back?","Does my partner need treatment?","Should I be tested for sexually transmitted infections?"],
["Discharge with a fever, pelvic pain or pain with sex","Unusual discharge during pregnancy: tell your midwife or GP promptly"],
['nhs','nice','rcog']),

X('thrush','Vaginal thrush','A yeast infection causing itching and soreness',
"A common yeast infection causing itching, soreness and thick white discharge.",
['teen','repro','preg','meno'],['repro'],['Itching','Unusual discharge','Burning when peeing'],
"Thrush is a common yeast infection, caused by an overgrowth of a fungus called Candida that normally lives harmlessly in the vagina. It isn't a sexually transmitted infection, but it can cause a lot of discomfort. Most people get it at some point.",
["Itching and irritation around the vagina and vulva","Thick, white discharge that doesn't usually smell, sometimes like cottage cheese","Soreness, redness or swelling","Stinging when you pee","Pain during sex"],
["Antibiotics can upset the balance of vaginal organisms.","Pregnancy, uncontrolled diabetes and a weakened immune system raise the chance.","Hormonal changes, and irritants such as scented products or tight, non-breathable clothing, can play a part."],
["It's often diagnosed from your symptoms, and a pharmacist can help.","See a GP or sexual health clinic if it's your first time, or you're pregnant, or it keeps coming back (four or more times a year), or treatment hasn't worked.","A swab can confirm it and rule out other causes."],
["Antifungal treatment, such as a pessary, cream or a single capsule, is available from pharmacies. A pharmacist can check which option is suitable for you, and some are not suitable in pregnancy.","Avoid scented soaps, douching and tight synthetic clothing.","If it keeps coming back, a longer course may be prescribed and your doctor may check for other causes, such as diabetes."],
["Could this be something other than thrush?","Why do I keep getting it?","Should I be checked for diabetes?","Which treatment is safe for me if I'm pregnant or breastfeeding?"],
["Sores, blisters or ulcers on the vulva","Fever, pelvic pain, or symptoms during pregnancy that don't settle"],
['nhs','nice','rcog']),

X('uti','Urinary tract infection (UTI)','Often called cystitis',
"A bladder or urinary infection causing burning when you pee and a frequent need to go.",
['teen','repro','preg','meno','later'],['urinary'],['Burning when peeing','Frequent urination','Blood in urine','Pelvic pain'],
"A urinary tract infection (UTI) is an infection of the bladder, urethra or sometimes the kidneys. Women get them more often than men because the urethra is shorter. A bladder infection is uncomfortable but usually clears quickly with treatment, while a kidney infection needs urgent care.",
["Burning or stinging when you pee","Needing to pee more often or urgently","Cloudy, strong-smelling or blood-stained urine","Pain low in your tummy","Feeling generally unwell or tired","Signs of a kidney infection: fever, shivering, pain in the back or side, nausea or vomiting"],
["Bacteria from the bowel get into the urethra and bladder.","Sex, menopause (when lower oestrogen thins the lining of the urethra), pregnancy, diabetes and a weakened immune system can raise the chance."],
["A urine dipstick test can be done at your GP or pharmacy. A urine sample may be sent to the lab if infections are frequent or complicated.","In England, some pharmacies can assess and treat uncomplicated UTIs in women aged 16 to 64 without a GP appointment (the Pharmacy First scheme). Check with your local pharmacy."],
["Antibiotics, usually for a few days, prescribed by a pharmacist or GP.","Paracetamol or ibuprofen (if suitable for you) can ease pain. Drinking enough fluids is sensible but won't cure an infection.","If you get UTIs often, ask about prevention, such as vaginal oestrogen after menopause, or other advice.","Wipe front to back, pee after sex, and avoid irritants in the genital area."],
["Why do I keep getting UTIs?","Would vaginal oestrogen help me if I'm perimenopausal or menopausal?","Do I need a urine culture before antibiotics?","What should I do if symptoms don't improve in a couple of days?"],
["Fever, shivering, vomiting, pain in your back or side, or confusion: contact a GP, 111 or urgent care the same day","Any UTI symptoms in pregnancy: contact your midwife or GP the same day","Blood in your urine that isn't explained by an infection"],
['nhs','nice','rcog']),

X('urinary-incontinence','Urinary incontinence','Leaking urine',
"Leaking urine, often when you cough, laugh or exercise, or with a sudden strong urge to pee.",
['repro','preg','meno','later'],['urinary'],['Urine leaks','Frequent urination'],
"Urinary incontinence means leaking urine when you don't mean to. It is very common, especially after childbirth and around and after menopause, and it can usually be improved. Many people put off getting help because they feel embarrassed.",
["Leaking when you cough, sneeze, laugh, jump or exercise (stress incontinence)","A sudden, strong urge to pee that you can't hold (urge incontinence)","Needing to pee often, including at night","Leaking without any warning, or not feeling your bladder is empty"],
["Weak pelvic floor muscles, often after pregnancy and childbirth.","Menopause, because lower oestrogen can affect the bladder and urethra.","Being overweight, constipation, a long-term cough or some medicines.","Urine infections can cause a temporary worsening."],
["A GP or nurse will usually ask about your symptoms, check your pelvic floor and test your urine.","You may be asked to keep a bladder diary for a few days."],
["Pelvic floor exercises done regularly for at least three months are the first step for stress incontinence. A women's health physiotherapist can check you're doing them correctly.","Bladder training and cutting down on caffeine can help urge incontinence.","Losing weight if you're overweight, and treating constipation, can help.","Medicines or procedures may be offered if lifestyle steps aren't enough.","Vaginal oestrogen can help some people after menopause."],
["Which type of incontinence do I have?","Can I be referred to a pelvic health physiotherapist?","Are there medicines or procedures if exercises don't work?","Could my symptoms be linked to menopause?"],
["Leaking with numbness between your legs, back pain, or being unable to pass urine: seek urgent medical help (call 999 or go to A&E)","Blood in your urine, or leaking with pain and fever"],
['nhs','nice','bladder']),

X('pelvic-floor-problems','Pelvic floor problems and prolapse','Weak pelvic floor, pelvic organ prolapse',
"Weak or damaged pelvic floor muscles that can cause leaking, heaviness or a bulge in the vagina.",
['repro','preg','meno','later'],['urinary','repro'],['Urine leaks','Pelvic pain'],
"The pelvic floor is a group of muscles that support the bladder, womb and bowel. If they're weakened or damaged, for example by pregnancy and childbirth, you may leak urine or have a prolapse, where one of the pelvic organs drops down into the vagina. Both are common and treatable.",
["Leaking urine or struggling to hold wind or stools","A feeling of heaviness, dragging or pressure in the pelvis","A lump or bulge in or coming out of the vagina","Difficulty emptying your bladder or bowels","Pain or reduced sensation during sex","Discomfort that's worse at the end of the day or after standing for long"],
["Pregnancy and vaginal childbirth are the most common causes.","Menopause, long-term coughing, constipation and heavy lifting.","Being overweight, and a family history of prolapse."],
["A GP or specialist will ask about your symptoms and examine you, often with a speculum.","Further tests, such as bladder tests, may be arranged if you're considering surgery."],
["Pelvic floor exercises, ideally taught by a specialist physiotherapist.","Lifestyle steps such as treating constipation, avoiding heavy lifting and managing weight.","A vaginal pessary, a small device that supports the organs, can be fitted.","Vaginal oestrogen may help after menopause.","Surgery is an option if other treatments haven't helped."],
["Which pelvic floor treatment is right for me?","Could a pessary help?","What are the surgical options and risks?","Is it safe to keep exercising?"],
["Being unable to pass urine, or new numbness around the genitals or between your legs: call 999 or go to A&E","A prolapse that has become sore, bleeding or can't be pushed back"],
['nhs','nice','rcog']),

X('fibroids','Fibroids','Non-cancerous growths in or around the womb',
"Non-cancerous growths in or around the womb, often causing heavy periods and pressure symptoms.",
['repro','meno'],['repro'],['Heavy periods','Bloating','Frequent urination','Pelvic pain'],
"Fibroids are non-cancerous growths made of muscle and fibrous tissue that grow in or around the womb. They are very common, particularly in people in their 30s and 40s, and many people never know they have them. They can range from tiny to as large as a melon.",
["Heavy or long periods","Pain in the lower tummy or back","Needing to pee often","Constipation or bloating","Pain during sex","A feeling of fullness or a swollen tummy","Many people have no symptoms"],
["The cause isn't clear. Hormones (oestrogen and progesterone) seem to influence their growth.","They are more common in Black women, in people with a family history, and in those who are overweight.","They tend to shrink after menopause."],
["A GP may feel a lump in your tummy or find an enlarged womb on examination.","A pelvic ultrasound is the usual test. MRI or a camera test of the womb (hysteroscopy) may be used for more detail."],
["If you have no symptoms, you may not need treatment.","Medicines such as tranexamic acid or a hormonal coil (levonorgestrel IUS) can reduce bleeding and pain.","Other medicines can shrink fibroids for a time, often before surgery.","Procedures include fibroid embolisation, removing fibroids (myomectomy) or, if needed, a hysterectomy.","Your options depend on your symptoms, the size and position of fibroids and whether you hope to have children."],
["Where are my fibroids and how big are they?","Could they affect my fertility or pregnancy?","Which treatment fits my plans for children?","Is my anaemia, if I have it, linked to my periods?"],
["Sudden, severe pelvic pain","Bleeding so heavy you're soaking through pads or tampons every hour, or you feel faint"],
['nhs','nice','rcog']),

X('heavy-periods','Heavy periods','Also called menorrhagia',
"Periods that are heavy enough to affect your daily life, including soaking through protection or passing large clots.",
['teen','repro','meno'],['repro'],['Heavy periods','Fatigue','Dizziness'],
"Heavy periods (heavy menstrual bleeding) are very common. There's no fixed amount of blood that counts as heavy. If your bleeding disrupts your life, it's worth treating, and there are good options.",
["Soaking through a pad or tampon every one to two hours","Needing to use two types of protection together","Passing blood clots larger than about 2.5cm","Bleeding that lasts more than seven days","Flooding or leaking onto clothes or bedding","Tiredness or feeling short of breath, which can be signs of low iron"],
["In many people no cause is found.","Fibroids, adenomyosis, endometriosis, polyps, PCOS and thyroid conditions can cause them.","Some contraception, such as a copper coil, can make periods heavier.","Less often, blood clotting conditions, which are worth asking about if heavy periods began at your first period."],
["Your GP will usually ask about your periods and check for anaemia with a blood test.","An examination and, if needed, an ultrasound or other tests can look for a cause."],
["The hormonal coil (levonorgestrel IUS) is often recommended first, because it works very well for heavy bleeding.","Tranexamic acid and mefenamic acid taken during your period can reduce flow and pain.","The combined contraceptive pill or other hormonal treatments can also help.","Procedures such as endometrial ablation, or hysterectomy, are options if other treatments don't work.","If you're anaemic, you'll need iron treatment alongside treating the periods."],
["Do I need any tests to find the cause?","Am I anaemic?","Would a hormonal coil suit me?","What can I do if medicines aren't working?"],
["Soaking through protection every hour for several hours, or feeling faint or dizzy","Heavy bleeding if you may be pregnant"],
['nhs','nice','rcog']),

X('pms-pmdd','PMS and PMDD','Premenstrual syndrome and premenstrual dysphoric disorder',
"Physical and emotional symptoms in the one to two weeks before a period. PMDD is a severe form.",
['teen','repro','meno'],['horm'],['Mood changes','Bloating','Fatigue','Low mood','Breast changes'],
"Premenstrual syndrome (PMS) is a group of physical and emotional symptoms that come in the days before your period and ease once it starts. Premenstrual dysphoric disorder (PMDD) is a more severe form, in which mood symptoms such as low mood, anxiety or anger can seriously affect your life.",
["Mood swings, irritability or anger","Feeling anxious, low or tearful","Bloating, breast tenderness or headaches","Tiredness and trouble sleeping","Food cravings or appetite changes","PMDD: severe low mood, hopelessness, feeling out of control, or thoughts of self-harm"],
["PMS and PMDD are thought to be caused by the way your body reacts to normal hormone changes in the second half of your cycle.","They aren't caused by 'too much' or 'too little' of a hormone.","Stress, family history and some medical conditions can make them worse."],
["There's no single test. A symptom diary kept for at least two cycles shows whether symptoms follow a pattern.","Your doctor may rule out other conditions, such as thyroid problems, anaemia or depression that isn't linked to your cycle."],
["Regular exercise, a balanced diet, enough sleep and reducing alcohol and caffeine can help.","Cognitive behavioural therapy (CBT) can help with mood symptoms.","Some contraceptive pills can help PMS. Antidepressants called SSRIs are an option for severe PMS and PMDD.","Some people use supplements. See the Supplements section for what the evidence says."],
["Could my symptoms be PMDD?","Would the contraceptive pill or an SSRI help me?","How should I record my symptoms?","What other support is available?"],
["Thoughts of harming yourself or ending your life: call 999, or Samaritans on 116 123 any time, or NHS 111 for urgent help","Feeling unable to cope or unsafe"],
['nhs','nice','mind']),

X('period-pain','Period pain','Also called dysmenorrhoea',
"Cramping pain in the lower tummy before or during a period.",
['teen','repro','meno'],['repro'],['Painful periods','Pelvic pain'],
"Period pain is very common and usually mild to moderate. Pain that stops you doing normal activities, gets worse over time or begins in your 20s or later may have an underlying cause, such as endometriosis or adenomyosis, and is worth getting checked.",
["Cramping pain in the lower tummy, sometimes spreading to the back and thighs","Pain that starts just before or at the start of your period and lasts one to three days","Feeling sick, headaches, or loose stools","Pain that worsens with each period, or that is severe, may suggest another condition"],
["Chemicals called prostaglandins make the womb muscle contract to shed its lining, causing cramps.","Secondary causes include endometriosis, adenomyosis, fibroids and pelvic infection."],
["Your doctor will ask about your pain and periods.","If your pain is severe or not improving with treatment, you may have an ultrasound or other tests to check for another cause."],
["Heat, such as a hot water bottle, and gentle exercise can help.","Anti-inflammatory painkillers (such as ibuprofen, if suitable for you) taken at the first sign of pain, or paracetamol.","The contraceptive pill or hormonal coil can reduce pain.","TENS machines help some people.","See your GP if over-the-counter treatment isn't enough."],
["Could an underlying condition be causing my pain?","Are hormonal treatments suitable for me?","When should I have a scan?","What pain relief is safest for me?"],
["Sudden severe pelvic pain, fainting or fever","Severe pain that comes with heavy bleeding or if you may be pregnant"],
['nhs','nice','rcog']),

X('absent-periods','Absent periods','Missed periods, also called amenorrhoea',
"No periods for three months or more when you're not pregnant, or not having a first period by 15 or 16.",
['teen','repro','meno'],['repro','horm'],['Irregular periods','Fatigue'],
"Missing periods can have many causes, from pregnancy and breastfeeding to hormone conditions and stress. If you've had regular periods and miss three or more in a row, or you haven't started periods by about 15 or 16, it's worth speaking to a doctor.",
["No periods for three months or more","No periods starting by age 15 or 16","Irregular or infrequent periods","Other signs depending on cause: acne, extra hair, hot flushes, milky nipple discharge, weight changes"],
["Pregnancy and breastfeeding are the most common causes.","PCOS, thyroid problems and high prolactin.","Stress, heavy exercise, being underweight or not eating enough.","Early menopause or premature ovarian insufficiency.","Some contraception, for example the hormonal coil or implant."],
["A pregnancy test is usually the first step.","Blood tests can check hormones such as thyroid hormone, prolactin and FSH.","A pelvic scan may be needed."],
["Treatment depends on the cause. Some causes need no treatment, while others, such as PCOS or thyroid problems, have specific treatments.","If your period loss is linked to low weight, restrictive eating or over-exercise, getting support matters for your bones and long-term health. A GP can help without judgement.","If you're not trying to get pregnant, your periods being absent doesn't mean you can't conceive."],
["Which tests do I need?","Could my missed periods affect my bones or fertility?","Do I need contraception even though I'm not having periods?","What support is there if stress, eating or exercise is a factor?"],
["Missed period with severe one-sided tummy pain, shoulder tip pain or feeling faint: possible ectopic pregnancy, seek emergency help","Missed periods with milky nipple discharge or severe headaches and vision changes"],
['nhs','nice','rcog']),

X('ovarian-cysts','Ovarian cysts','Fluid-filled sacs on the ovaries',
"Fluid-filled sacs on or in an ovary. Most are harmless and go away on their own.",
['teen','repro','meno','later'],['repro'],['Pelvic pain','Bloating','Painful sex'],
"Ovarian cysts are common and usually harmless. Most develop as part of your normal menstrual cycle (functional cysts) and disappear without treatment. Others, such as endometriomas or dermoid cysts, may need follow-up.",
["Often no symptoms","Dull ache or heaviness in the lower tummy or back","Bloating or a feeling of fullness","Pain during sex","Needing to pee more often","Irregular periods"],
["Functional cysts form when an egg isn't released or the follicle seals up after release.","Endometriosis, PCOS and some other conditions can cause cysts.","After menopause, cysts need more careful checking."],
["A pelvic ultrasound is the usual test.","If you're past menopause or the cyst looks unusual, a blood test (CA125) and specialist review may be arranged."],
["Many cysts disappear within a few cycles, so your doctor may suggest rechecking with another scan.","Painkillers can help with discomfort.","Surgery is sometimes advised for large cysts, those that don't resolve, or if there's concern.","Hormonal contraception doesn't dissolve existing cysts but may prevent new ones in some people."],
["What type of cyst do I have?","Do I need another scan, and when?","Could this affect my fertility?","What symptoms should make me return?"],
["Sudden, severe pelvic pain, especially with vomiting, fever or fainting (a cyst can burst or twist)","Pain with a missed period (possible ectopic pregnancy)"],
['nhs','nice','rcog']),

X('ovarian-cancer','Ovarian cancer','Persistent bloating is the key symptom to know',
"A less common cancer where early symptoms, such as persistent bloating, are easy to miss.",
['repro','meno','later'],['repro','cancer'],['Bloating','Pelvic pain','Frequent urination'],
"Ovarian cancer isn't common, but it's often found late because early symptoms can seem vague. It's most common after menopause. Knowing the symptoms and not ignoring ones that persist can help find it earlier. There is no national screening programme.",
["Persistent bloating that doesn't come and go","Feeling full quickly or loss of appetite","Pain in the pelvis or lower tummy","Needing to pee more urgently or more often","Other symptoms can include changes in bowel habits, tiredness or unexplained weight loss","Symptoms that are new for you and happen on most days, especially if over 50, are more worrying"],
["The cause isn't fully known.","Risk rises with age and with certain inherited gene changes, such as BRCA1 and BRCA2, or a strong family history of ovarian or breast cancer.","Other factors can include never having been pregnant, and endometriosis."],
["See your GP if you have symptoms like these frequently, particularly more than 12 times a month, and especially if you're over 50.","A blood test (CA125) and a pelvic ultrasound are the first tests.","If these suggest cancer, you'll be referred urgently to a specialist."],
["Treatment usually involves surgery and chemotherapy.","Other treatments, such as targeted therapies, may be used depending on the type and stage.","Specialist nurses and charities can offer support and information."],
["Could my symptoms be ovarian cancer? Should I have a CA125 test and scan?","How long should I wait before coming back if symptoms continue?","Should I have genetic counselling given my family history?","What support is available?"],
["Persistent bloating, feeling full quickly or pelvic pain: see your GP promptly rather than waiting","Sudden severe tummy pain, vomiting or being unable to eat or drink: seek urgent care"],
['nhs','nice','ovca','cruk']),

X('cervical-cancer','Cervical cancer and screening','Cervical screening ("smear tests") prevents most cases',
"Almost all cervical cancers are caused by HPV. Regular screening finds changes early, before cancer develops.",
['repro','meno','later'],['repro','cancer'],['Bleeding between periods','Bleeding after sex','Unusual discharge'],
"Cervical cancer is almost always caused by long-term infection with high-risk types of the human papillomavirus (HPV). Screening checks for HPV and cell changes, so treatment can prevent cancer from developing. The HPV vaccine, offered in schools, helps protect against it.",
["Early cervical cancer often has no symptoms, which is why screening matters","Bleeding between periods, after sex or after menopause","Unusual or bloody vaginal discharge","Pain during sex","Pelvic pain"],
["Most people are exposed to HPV at some point, and in most it clears on its own.","In some people, persistent high-risk HPV causes cell changes that can develop into cancer over years.","Smoking and a weakened immune system raise the risk."],
["In England, cervical screening is offered from age 25 to 64. How often you're invited (every three to five years) depends on your age and previous results. The sample is tested for HPV first. Check the current NHS guidance for your own schedule.","If you have symptoms, don't wait for screening. See your GP.","If screening finds changes, you may be referred for colposcopy, where the cervix is looked at closely and a small sample may be taken."],
["Abnormal cells found at screening can be removed with a small procedure, which prevents cancer from developing.","If cancer is diagnosed, treatment can include surgery, radiotherapy and chemotherapy depending on the stage.","The HPV vaccine is offered to young people (from the age of 12 to 13) and protects against high-risk HPV types.","Attending screening matters even if you've had the vaccine."],

X('endometrial-cancer','Womb (endometrial) cancer','Bleeding after menopause should always be checked',
"A cancer of the womb lining. Bleeding after menopause is the main warning sign and should always be checked.",
['meno','later'],['repro','cancer'],['Bleeding between periods','Pelvic pain','Unusual discharge'],
"Womb cancer, also called endometrial cancer, affects the lining of the womb. It's most common after menopause. It's often found early because bleeding after menopause prompts people to seek help, and early cases are often treated successfully.",
["Vaginal bleeding after menopause, even a small amount","Bleeding between periods or heavier periods than usual if you're still having them","Unusual vaginal discharge","Pain in the pelvis or lower tummy, or pain during sex (less common)"],
["Higher oestrogen exposure without enough progesterone raises the risk.","Being overweight, type 2 diabetes, PCOS, never having children and taking tamoxifen increase the risk.","Some inherited conditions, such as Lynch syndrome, raise the risk.","Combined HRT (with progesterone) doesn't have the same risk, but oestrogen-only HRT in someone with a womb isn't recommended."],
["See your GP urgently if you have any bleeding after menopause.","You'll usually be referred for a pelvic ultrasound and, if needed, a hysteroscopy and a small sample (biopsy) of the womb lining."],
["The main treatment is surgery to remove the womb, ovaries and tubes.","Some people also have radiotherapy, hormone therapy or chemotherapy.","Most causes of bleeding after menopause aren't cancer, but they must be checked."],
["Could my bleeding be serious and what tests do I need?","What other conditions could cause this?","How quickly will I be seen?","Is my HRT suitable for me?"],

X('breast-changes','Breast pain and benign breast changes','Most lumps and pain are not cancer',
"Breast pain and lumpiness are common and usually harmless, but any new change is worth getting checked.",
['teen','repro','preg','meno','later'],['breast'],['Breast changes','Mood changes'],
"Breast pain and lumpiness are very common and usually linked to your hormones. Most breast lumps are not cancer, for example fluid-filled cysts or fibroadenomas. Still, any new lump or change should be checked by a doctor so you have peace of mind.",
["Breast pain or tenderness that comes and goes with your cycle (cyclical)","Breast pain that doesn't follow your cycle (non-cyclical)","General lumpiness that feels similar in both breasts","A smooth, movable lump (could be a fibroadenoma or cyst)","Breast pain linked to a poorly fitting bra, or to breastfeeding (such as mastitis)"],

["A GP will examine your breasts and may refer you to a breast clinic if there's a lump or another change.","The clinic may do a mammogram, ultrasound or take a small sample (biopsy)."],
["Wearing a supportive, well-fitted bra can help pain.","Simple painkillers and a warm or cool compress can ease discomfort.","A symptom diary can show whether pain is related to your cycle.","Cysts may be drained, and most fibroadenomas don't need treatment."],
["Is this lump something to be worried about?","Do I need a referral to a breast clinic?","Is my breast pain linked to my contraception or HRT?","How should I check my breasts?"],
["A new lump or thickening in a breast or armpit: see your GP promptly","Skin changes, nipple changes or bloody nipple discharge: see your GP promptly"],

X('breast-cancer','Breast cancer','Know what is normal for you',
"The most common cancer in women in the UK. Finding it early makes treatment more likely to succeed.",
['repro','meno','later'],['breast','cancer'],['Breast changes'],
"Breast cancer is the most common cancer in women in the UK. Many breast cancers are found at an early stage, when treatment is most likely to work. Knowing how your breasts normally look and feel and attending screening can help find it sooner.",
["A new lump or thickening in a breast or armpit","A change in size, shape or feel of a breast","Skin changes such as dimpling, puckering or a rash","A change in the nipple, such as turning inwards, or discharge, which may be bloody","Pain in one breast that doesn't go away (less common)"],
["The cause isn't fully understood. Age is the biggest risk factor.","A family history of breast or ovarian cancer, inherited changes in genes such as BRCA1 and BRCA2, and some hormone factors raise the risk.","Alcohol, being overweight after menopause and lack of exercise raise the risk."],
["See your GP if you notice a change. You can be referred to a breast clinic for a mammogram, ultrasound or biopsy.","In England, NHS breast screening with mammograms is offered every three years from around age 50 up to the age of 71."],
["Treatment can include surgery, radiotherapy, chemotherapy, hormone therapy and targeted treatments, depending on the type and stage.","Specialist breast care nurses and charities can offer practical and emotional support.","Many people are treated successfully, especially when it's found early."],
["Is this change something to worry about?","Do I need a referral and how quickly?","Should I have genetic testing given my family history?","Am I eligible for screening and when is mine due?"],

X('osteoporosis','Osteoporosis','Fragile bones',
"A condition that weakens bones, making them more likely to break. Risk increases after menopause.",
['meno','later'],['bone'],['Fatigue'],
"Osteoporosis weakens bones so they break more easily, particularly in the wrist, hip and spine. It often has no symptoms until a bone breaks. Oestrogen helps protect bones, so the risk goes up after menopause. There is plenty you can do to protect your bones.",
["Usually no symptoms until a fracture","A bone that breaks after a minor fall or bump","Loss of height over time","A curved upper back (stooped posture)","Sudden back pain from a spinal fracture"],
["Falling oestrogen levels after menopause, or early menopause.","Family history, low body weight, smoking and high alcohol intake.","Long-term steroid use and some medical conditions.","Not getting enough calcium or vitamin D."],
["A doctor can estimate your fracture risk with an online tool called FRAX.","A bone density scan (DXA) may be offered if you're at higher risk."],
["Weight-bearing and strength exercise, such as walking, dancing or lifting weights.","A balanced diet with enough calcium, and vitamin D, especially in autumn and winter in the UK.","Stopping smoking and keeping alcohol within recommended limits.","Medicines such as bisphosphonates can reduce fracture risk. HRT can help in some people.","Reducing the risk of falls matters too."],
["What is my fracture risk and do I need a scan?","Do I need calcium or vitamin D supplements?","Which medicine would suit me?","How can I reduce my risk of falling?"],
["Sudden, severe back pain, or a fracture after a minor fall: seek medical help","If you cannot put weight on a leg after a fall: call 999 or go to A&E"],

X('hypothyroidism','Underactive thyroid (hypothyroidism)','When your thyroid makes too little hormone',
"The thyroid gland doesn't make enough hormone, which can cause tiredness, weight gain and feeling cold.",
['teen','repro','preg','meno','later'],['horm'],['Fatigue','Heavy periods','Mood changes'],
"An underactive thyroid (hypothyroidism) means your thyroid doesn't produce enough thyroid hormone. It's much more common in women, especially after pregnancy and in midlife. Symptoms are easy to mistake for other things, but a simple blood test can diagnose it and treatment works well.",
["Tiredness and slowing down","Weight gain without eating more","Feeling cold more than other people","Dry skin, thinning or dry hair","Constipation","Low mood, poor memory or concentration","Heavier or irregular periods","Muscle aches and a hoarse voice or puffy face"],
["The most common cause is an autoimmune condition called Hashimoto's thyroiditis.","It can follow pregnancy (postpartum thyroiditis), thyroid surgery or radioactive iodine treatment.","Some medicines can affect the thyroid."],
["A blood test measures thyroid stimulating hormone (TSH) and thyroid hormone (T4)."],
["Treatment is a daily tablet of levothyroxine, which replaces the missing hormone.","You'll have regular blood tests to check the dose. It's usually taken long term.","Take it on an empty stomach as advised, and leave a gap before iron or calcium supplements because they can reduce absorption.","If you're planning pregnancy or pregnant, tell your doctor, because your dose often needs adjusting."],
["Should I have a thyroid test?","Could my symptoms be linked to my thyroid?","How often will I have blood tests?","How does my thyroid affect pregnancy?"],
["Severe symptoms such as confusion, very slow heartbeat or feeling extremely cold and drowsy: seek urgent medical help","Sudden palpitations, chest pain or breathlessness"],
['nhs','nice','btf']),

X('pid','Pelvic inflammatory disease (PID)','Infection of the womb, tubes and ovaries',
"An infection of the upper female genital tract, often caused by a sexually transmitted infection.",
['teen','repro'],['repro','sexual'],['Pelvic pain','Unusual discharge','Painful sex','Bleeding between periods'],
"Pelvic inflammatory disease (PID) is an infection of the womb, fallopian tubes or ovaries. It is often caused by bacteria from a sexually transmitted infection such as chlamydia or gonorrhoea moving upwards. Early treatment prevents complications such as ongoing pain or fertility problems.",
["Pain in the lower tummy or pelvis","Unusual vaginal discharge, sometimes with a smell","Pain during sex","Bleeding between periods or after sex","Pain or burning when you pee","Fever, or feeling generally unwell in severe cases","Some people have mild or no symptoms"],
["Chlamydia and gonorrhoea are common causes.","Infection can also follow childbirth, miscarriage, abortion or putting in a coil, though this is less common.","Having a new partner, or multiple partners, raises the chance."],
["A doctor or sexual health clinic will examine you and take swabs.","A urine test, blood tests or a pelvic ultrasound may also be used."],
["A course of antibiotics, which may include more than one type.","Your recent sexual partners need testing and treatment, and you should avoid sex until you and they have completed treatment.","Complications can include long-term pelvic pain, ectopic pregnancy and difficulty getting pregnant, which is why early treatment matters.","See a sexual health clinic, which is free and confidential."],
["Should I be tested for other infections?","Does my partner need treatment?","Could this affect my fertility?","When can I have sex again?"],
["Severe pelvic pain, high fever, vomiting or feeling very unwell: seek urgent medical help","Pain with a missed period or with possible pregnancy: seek urgent help (possible ectopic pregnancy)"],

['teen','repro','meno','later'],['sexual','repro'],['Unusual discharge','Burning when peeing','Bleeding between periods','Itching'],
"STIs such as chlamydia, gonorrhoea, genital herpes, genital warts and syphilis are common. Many people have no symptoms, so you can have one without knowing. Most are easily treated, and testing at a sexual health clinic is free, confidential and doesn't need a GP referral.",
["Often no symptoms, especially with chlamydia","Unusual vaginal discharge","Pain or burning when you pee","Bleeding between periods or after sex","Pain during sex or in the lower tummy","Sores, blisters, lumps or warts around the genitals or anus","Itching or irritation"],
["Passed on through vaginal, anal or oral sex and sometimes by close skin contact.","Condoms reduce the risk of most STIs.","Untreated chlamydia and gonorrhoea can lead to pelvic inflammatory disease and fertility problems."],
["Testing involves a swab, urine test or blood test, depending on the infection.","Sexual health clinics offer free testing, and many areas offer free home test kits.","In England, chlamydia screening is offered to under-25s."],
["Chlamydia and gonorrhoea are treated with antibiotics.","Herpes and HIV are managed with antiviral medicines, and warts can be treated in several ways.","Partners need to be told and treated so you don't pass the infection back and forth.","Avoid sex until treatment is finished and you've been told it's safe."],
["Which tests do I need and how often?","How do I tell my partner?","Do I need to avoid sex, and for how long?","What protection and vaccines (HPV, hepatitis B) do I need?"],

X('vaginismus','Vaginismus','Involuntary tightening of the vaginal muscles',
"Involuntary tightening of the muscles around the vagina that makes penetration painful or impossible.",
['teen','repro','meno'],['sexual'],['Painful sex'],
"Vaginismus is when the muscles around the vagina tighten involuntarily, making sex, a smear test, or using a tampon painful or impossible. It isn't your fault, and it isn't a sign that something is 'wrong' with you. It's common and very treatable with the right support.",
["Pain or a feeling of tightness or blocking when trying to insert a tampon, finger or penis","Difficulty or inability to have sex or to have an internal exam","Burning or stinging","Fear or anxiety about penetration"],
["It's often linked to fear or anxiety about pain, which causes the muscles to tighten automatically.","Painful sex before, infections, childbirth, painful conditions and past experiences can contribute.","Sometimes no cause is found."],
["A GP, nurse or gynaecologist can talk with you and, if you're comfortable, examine you gently. You can ask for a female clinician or a chaperone and stop at any time.","Other causes of pain, such as infection or skin conditions, are checked."],
["Treatment is usually a combination of education, relaxation techniques and gradually getting used to touch and insertion at your own pace, sometimes with vaginal trainers (dilators).","Psychosexual therapy, CBT and specialist pelvic floor physiotherapy are very effective.","Treatment works best with support from a clinician who understands the condition.","You can seek help through your GP, a sexual health clinic or a psychosexual therapist."],
["Can you refer me to a specialist or psychosexual therapist?","Can I stop an examination at any time?","How long does treatment usually take?","Could other conditions be causing my pain?"],
["Severe pain, bleeding or discharge: see your GP promptly","Distress that is affecting your mood or safety: reach out to your GP or NHS 111"],

X('vulvodynia','Vulvodynia','Long-term vulval pain without a clear cause',
"Ongoing pain, burning or soreness of the vulva with no obvious cause.",
['repro','meno','later'],['sexual'],['Painful sex','Itching'],
"Vulvodynia means ongoing pain in the vulva (the skin around the vaginal opening) for three months or more, without an obvious cause such as infection or skin disease. The pain can be constant or triggered by touch, tampons or sex. It's real and treatable, though it can take time to find the right approach.",
["Burning, stinging, rawness or soreness of the vulva","Pain triggered by touch, tampons, tight clothes, cycling or sex","Pain that comes on without any trigger","Pain that can be constant or come and go"],
["The cause isn't fully understood. Nerves may become oversensitive.","Past infections, hormonal changes, tight pelvic floor muscles and skin conditions may be involved.","Diagnosis often follows other causes being ruled out."],
["A GP or specialist will examine you and take swabs to rule out infection.","A gentle touch test with a cotton bud may be used to find where the pain is.","Tests for skin conditions, such as lichen sclerosus, may be done."],
["Avoid irritants such as scented soap, wipes and tight clothing, and use plain emollients.","Local anaesthetic gels, nerve pain medicines such as amitriptyline or gabapentin, and pelvic floor physiotherapy may be offered.","CBT and psychosexual support can help you cope and reduce pain.","Specialist vulval clinics offer treatment if first-line approaches aren't enough."],
["Have infections and skin conditions been ruled out?","Can I be referred to a vulval clinic?","Which medicines could help?","What can I do about pain during sex?"],

X('lichen-sclerosus','Lichen sclerosus','A long-term skin condition affecting the vulva',
"A long-term skin condition causing white patches, itching and soreness, most often around the vulva.",
['teen','repro','meno','later'],['sexual'],['Itching','Painful sex'],
"Lichen sclerosus is a long-term skin condition that mostly affects the skin around the vulva and anus. It's not contagious and not caused by poor hygiene. It's often missed or mistaken for thrush, so many people wait a long time for a diagnosis. Treatment works well and prevents scarring.",
["Intense itching, particularly at night","White or pale, thin, crinkly patches of skin","Soreness, burning or pain, including during sex","Easy bruising, splitting, tearing or small blood blisters","Changes in the shape of the vulva over time, if untreated"],
["The cause isn't known. It's thought to be an autoimmune condition.","It can happen at any age but is most common after menopause and in girls before puberty.","It is linked to other autoimmune conditions."],
["A GP can often recognise it by looking, and may refer you to a dermatologist or gynaecologist.","A small skin sample (biopsy) may be taken to confirm it."],
["A strong steroid ointment (such as clobetasol propionate) applied as prescribed is the main treatment, usually for a few months, then as needed.","Plain emollients, and avoiding soaps and irritants, help soothe the skin.","It's usually a long-term condition, so regular follow-up is advised.","There's a small increased risk of skin cancer of the vulva, so see a doctor about any lump, sore or patch that doesn't heal."],
["Could this be lichen sclerosus rather than thrush?","Do I need a biopsy?","How often should I use the steroid ointment?","How often should I be checked?"],

X('miscarriage','Miscarriage','Losing a pregnancy before 24 weeks',
"The loss of a pregnancy in the first 23 weeks. It's common, and it's rarely anyone's fault.",
['repro','preg'],['preg'],['Pelvic pain'],
"A miscarriage is the loss of a pregnancy before 24 weeks. It's common, particularly in the first 12 weeks, and the cause is usually a chromosome problem in the pregnancy. It is almost never caused by anything you did or didn't do. Many people feel grief, and support is available.",
["Vaginal bleeding, from light spotting to heavy bleeding with clots","Cramping or lower tummy pain","Passing tissue from the vagina","Pregnancy symptoms, such as nausea or sore breasts, going away","Some people have no symptoms and the miscarriage is found at a scan"],
["Most early miscarriages are caused by chromosome changes in the pregnancy, and are not preventable.","Risk rises with age. Smoking, heavy alcohol use and some medical conditions may increase the risk.","Exercise, sex, stress and lifting do not cause miscarriage."],
["Contact your GP, midwife or early pregnancy unit if you have bleeding or pain in early pregnancy.","An ultrasound scan and sometimes blood tests can show whether the pregnancy is continuing.","Tests to look for a cause are usually offered after three or more miscarriages in a row."],
["Options usually include waiting for the miscarriage to happen naturally, taking medicine to bring it on, or a small surgical procedure.","You'll be offered pain relief and advice on bleeding, and contraception when you're ready.","Emotional support is important. Charities and counselling can help, and partners are affected too.","Most people go on to have a healthy pregnancy afterwards."],
["What are my options for managing a miscarriage?","What bleeding and pain are normal, and what isn't?","When can I try again, if I want to?","What emotional support is available?"],

X('ectopic-pregnancy','Ectopic pregnancy','A pregnancy growing outside the womb',
"A pregnancy that starts outside the womb, usually in a fallopian tube. It needs urgent medical care.",
['repro','preg'],['preg'],['Pelvic pain'],
"In an ectopic pregnancy, a fertilised egg implants outside the womb, most often in a fallopian tube. The pregnancy can't continue and it can cause the tube to burst, which is a medical emergency. Knowing the signs can save lives, and early treatment is very effective.",
["Pain low in your tummy, often on one side","Vaginal bleeding or a brown, watery discharge","Pain at the tip of your shoulder","Pain when you pee or poo","Feeling dizzy or faint, or collapsing, which can mean internal bleeding","Usually appears at 4 to 12 weeks, often after a missed period"],
["A previous ectopic pregnancy, tubal damage or surgery.","Pelvic inflammatory disease or chlamydia, endometriosis, or becoming pregnant with a coil in place.","Smoking and fertility treatment can raise the risk, though many people with an ectopic pregnancy have no risk factors."],
["You'll be assessed at an early pregnancy unit or hospital with a pregnancy test, blood tests and a scan.","If you have symptoms, you should be seen urgently the same day."],
["Medicine (methotrexate) can end an early ectopic pregnancy when it's caught in time.","Keyhole surgery removes the pregnancy and sometimes the tube.","If the tube has burst, emergency surgery is needed.","Emotional support after an ectopic pregnancy is important, and many people go on to have healthy pregnancies."],
["What is my risk of another ectopic pregnancy?","How will I be monitored after treatment?","Will this affect my fertility?","What support is available?"],

X('hyperemesis-gravidarum','Hyperemesis gravidarum','Severe pregnancy sickness',

['preg'],['preg'],['Nausea','Fatigue','Dizziness'],
"Hyperemesis gravidarum (HG) is severe nausea and vomiting in pregnancy. It's more than morning sickness, and can lead to dehydration and weight loss. It isn't your fault, it isn't 'all in the mind', and effective treatments exist. It often eases by about 20 weeks, but can last longer.",
["Nausea and vomiting that is persistent and severe","Being unable to keep food or drink down","Weight loss of more than 5% of your pre-pregnancy weight","Dehydration, with dark urine, dizziness or passing little urine","Extreme tiredness, drooling or heightened sense of smell"],
["The cause isn't fully understood but is linked to pregnancy hormones.","It's more likely if you had it in an earlier pregnancy, have a family history, or are expecting twins.","It often begins around 4 to 7 weeks."],
["Diagnosis is based on your symptoms. A doctor may check your urine for ketones, your weight and your blood pressure.","Don't wait to ask for help if you can't keep fluids down."],
["Anti-sickness medicines that are safe in pregnancy, such as cyclizine, prochlorperazine or ondansetron, can help.","Fluids through a drip in hospital if you're dehydrated.","Small, frequent meals, avoiding triggers and resting. Ginger and acupressure bands help some people mildly, though the evidence is limited.","Vitamin supplements such as vitamin B6 or thiamine may be advised by your doctor.","Support groups such as Pregnancy Sickness Support can help."],

X('postnatal-depression','Postnatal depression','Depression after having a baby',

"Postnatal depression is a type of depression that can start any time in the first year after having a baby. It's common and treatable, and it doesn't mean you're a bad parent. It's different from the 'baby blues' (tearfulness in the first two weeks) which pass on their own.",

["What treatments are available and are they compatible with breastfeeding?","How can I get therapy quickly?","How can my partner and family support me?","What if my symptoms get worse?"],

X('premature-ovarian-insufficiency','Premature ovarian insufficiency (POI)','Early menopause before 40',

['teen','repro'],['horm'],['Irregular periods','Hot flushes','Vaginal dryness','Mood changes'],
"Premature ovarian insufficiency (POI), sometimes called premature or early menopause, is when your ovaries stop working normally before the age of 40. It affects around 1 in 100 women. Treatment is important for protecting your bones and heart, and support is available for fertility and emotional wellbeing.",
["Irregular or missing periods","Hot flushes and night sweats","Vaginal dryness and painful sex","Low mood, anxiety or trouble concentrating","Low sex drive","Difficulty getting pregnant"],
["In many people no cause is found.","Genetic conditions (such as Turner syndrome or fragile X premutation), autoimmune disease, and some cancer treatments or surgery can cause it."],
["Blood tests to measure FSH (taken twice, a few weeks apart) along with your symptoms.","Other tests may check for causes such as thyroid problems or genetic conditions."],

["Should I take HRT and for how long?","What are my options for having a family?","How can I protect my bones and heart?","Where can I find support?"],
