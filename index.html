const _tc={};ENTRIES.forEach(e=>e.tags.forEach(t=>_tc[t]=(_tc[t]||0)+1));
TAGS=Object.keys(_tc).filter(t=>_tc[t]>=2).sort((a,b)=>_tc[b]-_tc[a]||a.localeCompare(b)).slice(0,18);

/* ---------- Storage (stays on this device) ---------- */
const mem={};
const store={
 get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]??null}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},
 clearAll(){try{['hz_profile','hz_saved','hz_req'].forEach(k=>localStorage.removeItem(k))}catch(e){}for(const k in mem)delete mem[k]}
};
let profile=store.get('hz_profile');
let saved=store.get('hz_saved')||[];
let reqs=store.get('hz_req')||[];
let viewStage=profile&&profile.stage?profile.stage:null;
let ob={step:1,age:null,stage:null};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stageName=k=>(STAGES.find(s=>s.k===k)||{}).n||'';
const byId=id=>ENTRIES.find(e=>e.id===id);
function saveProfile(){store.set('hz_profile',profile)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function rowHtml(e){
 return `<a class="row" href="#/entry/${e.id}"><span class="t">${esc(e.name)}</span><span class="s">${esc(e.short)}</span>${e.stages.map(s=>`<span class="meta">${esc(stageName(s))}</span>`).join('')}</a>`;
}
function matches(e,q){
 q=q.toLowerCase();
 return [e.name,e.aka,e.short,e.summary,...e.tags,...e.symptoms].join(' ').toLowerCase().includes(q);
}
const DISCLAIMER='Information only, not medical advice. This does not replace a conversation with a doctor, nurse or pharmacist. If you\'re worried about your health, speak to a healthcare professional.';

/* ---------- Views ---------- */
function viewOnboarding(){
 const app=$('#app');$('#tabs').innerHTML='';
 if(ob.step===1){
  app.innerHTML=`<div class="wrap ob">
   <div class="brand"><i></i>Her A–Z</div>
   <h1>Women's health, explained plainly.</h1>
   <p class="lead">Browse clear information on conditions across every life stage. Two quick questions help us show you the most relevant things first.</p>
   <p class="privacy">What you tell us stays on this device. We don't create an account or send your answers anywhere.</p>
   <h2 style="font-size:19px;margin-bottom:10px">How old are you?</h2>
   <div class="opts">${AGES.map(a=>`<button class="opt" data-age="${a}" aria-pressed="${ob.age===a}">${a}</button>`).join('')}</div>
   <button class="btn block" id="next" ${ob.age?'':'disabled style="opacity:.5"'}>Continue</button>
   <div style="text-align:center;margin-top:10px"><button class="link" id="guest">Continue as a guest</button></div>
  </div>`;
  app.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{ob.age=b.dataset.age;ob.stage=AGE_STAGE[ob.age];viewOnboarding()});
  $('#next').onclick=()=>{if(ob.age){ob.step=2;viewOnboarding();window.scrollTo(0,0)}};
 } else {
  app.innerHTML=`<div class="wrap ob">
   <div class="brand"><i></i>Her A–Z</div>
   <h1>Which describes you best right now?</h1>
   <p class="lead">We've pre-selected one based on your age. Change it if another fits better.</p>
   <div class="opts">${STAGES.map(s=>`<button class="opt" data-stage="${s.k}" aria-pressed="${ob.stage===s.k}">${s.n}<small>${s.d}</small></button>`).join('')}</div>
   <button class="btn block" id="done">Show me my guide</button>
   <div style="text-align:center;margin-top:10px"><button class="link" id="back">Back</button></div>
  </div>`;
  app.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{ob.stage=b.dataset.stage;viewOnboarding()});
  $('#back').onclick=()=>{ob.step=1;viewOnboarding()};
  $('#done').onclick=()=>{profile={guest:false,age:ob.age,stage:ob.stage,conditions:[]};saveProfile();viewStage=ob.stage;location.hash='#/';route()};
  return;
 }
 $('#guest').onclick=()=>{profile={guest:true,age:null,stage:null,conditions:[]};saveProfile();viewStage=null;location.hash='#/';route()};
}

function viewHome(){
 const app=$('#app');
 const conds=(profile.conditions||[]).map(byId).filter(Boolean);
 const list=viewStage?ENTRIES.filter(e=>e.stages.includes(viewStage)):ENTRIES;
 app.innerHTML=`<div class="wrap">
  <div class="brand"><i></i>Her A–Z</div>
  <div class="hero">
   <h1>${profile.guest?'Women\'s health, explained plainly.':'Your guide to women\'s health.'}</h1>
   <p>${profile.guest?'Browsing as a guest. Pick a life stage, or search for anything.':'Showing what matters at your life stage first.'}</p>
   <input class="search" id="q" type="search" placeholder="Search a condition or symptom" aria-label="Search a condition or symptom" autocomplete="off">
  </div>
  <div id="results" hidden></div>
  <div id="main">
   <div class="cards"><a class="card" href="#/ask"><b>Not sure what's going on?</b><span>Describe your symptoms and see what could fit, plus what to do next.</span></a><a class="card" href="#/supps"><b>Supplements</b><span>What the evidence says, with safety notes.</span></a></div>
   <div class="sec"><h2>Where are you in life right now?</h2>
    <div class="ribbon" role="group" aria-label="Life stage">${STAGES.map(s=>`<button class="stage" data-stage="${s.k}" aria-pressed="${viewStage===s.k}"><span class="dot"></span><b>${s.n}</b><span class="d">${s.d}</span></button>`).join('')}</div>
   </div>
   ${conds.length?`<div class="sec"><h2>Your conditions</h2><div class="list">${conds.map(rowHtml).join('')}</div></div>`:''}
   <div class="sec"><h2>${viewStage?`For ${esc(stageName(viewStage).toLowerCase())}`:'Start here'}</h2>
    <div class="list">${list.length?list.map(rowHtml).join(''):`<div class="empty">No guides for this stage yet. Tell us what to write first in the list below.</div>`}</div>
    ${viewStage?`<button class="link" id="allstages">Show all guides</button>`:''}
   </div>
   <div class="sec"><h2>Start from a symptom</h2>
    <p class="sub">Matching a symptom doesn't mean you have the condition. It only shows where to read more.</p>
    <div class="chips">${TAGS.map(t=>`<a class="chip" href="#/tag/${encodeURIComponent(t)}">${t}</a>`).join('')}</div>
   </div>
   <div class="sec"><h2>Coming next</h2>
    <p class="sub">Tap to tell us what to write first.</p>
    <div class="chips">${COMING.map(c=>`<button class="chip" data-req="${esc(c)}" aria-pressed="${reqs.includes(c)}">${esc(c)}${reqs.includes(c)?' ✓':''}</button>`).join('')}</div>
   </div>
   <p class="disclaimer">${DISCLAIMER}</p>
  </div>
 </div>`;
 app.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{viewStage=viewStage===b.dataset.stage?null:b.dataset.stage;viewHome();tabs()});
 const all=$('#allstages');if(all)all.onclick=()=>{viewStage=null;viewHome();tabs()};
 app.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>{
  const c=b.dataset.req;reqs=reqs.includes(c)?reqs.filter(x=>x!==c):[...reqs,c];store.set('hz_req',reqs);viewHome();tabs();
 });
 const q=$('#q');
 q.addEventListener('input',()=>{
  const v=q.value.trim();
  const res=$('#results'),main=$('#main');
  if(!v){res.hidden=true;main.hidden=false;return}
  const found=ENTRIES.filter(e=>matches(e,v));
  main.hidden=true;res.hidden=false;
  res.innerHTML=`<div class="sec"><h2>${found.length} result${found.length===1?'':'s'} for "${esc(v)}"</h2>
   <div class="list">${found.length?found.map(rowHtml).join(''):`<div class="empty">Nothing matches yet. Try a different word, or request it in "Coming next" after clearing your search.</div>`}</div></div>`;
 });
}

function viewTag(tag){
 const found=ENTRIES.filter(e=>e.tags.includes(tag));
 $('#app').innerHTML=`<div class="wrap">
  <button class="back" onclick="history.back()">← Back</button>
  <h1 style="font-size:30px;margin-bottom:8px">${esc(tag)}</h1>
  <p class="muted">Guides that mention this symptom. Matching a symptom doesn't mean you have the condition. Many things can cause the same symptom, so a doctor is the right person to work out why.</p>
  <div class="list" style="margin-top:18px">${found.length?found.map(rowHtml).join(''):'<div class="empty">No guides mention this symptom yet.</div>'}</div>
  <p class="disclaimer">${DISCLAIMER}</p>
 </div>`;
}

 if(hit.has('heavy_periods')&&(hit.has('dizzy')||R(/every (hour|half hour|30 min)|soak\w* .{0,25}(hour|hourly)/)))flags.push({lvl:'urgent',t:'Very heavy bleeding with dizziness needs urgent attention',x:'If you are soaking through protection every hour, passing large clots or feeling faint, contact NHS 111 or go to A&E.'});

 if(hit.has('pelvic_pain')&&hit.has('fever')&&!(ctx.preg||ctx.possible))flags.push({lvl:'urgent',t:'Pelvic pain with a fever should be checked today',x:'This can be a sign of an infection such as pelvic inflammatory disease. Contact your GP, a sexual health clinic, or NHS 111 today.'});

 /* scoring */
 const prof=(typeof profile==='object'&&profile&&profile.stage)||stage||null;
 const out=[];
 ENTRIES.forEach(e=>{
  const sx=SXP[e.id];if(!sx)return;
  let s=0;const m=[];
  Object.keys(sx).forEach(k=>{if(hit.has(k)){s+=sx[k];m.push(k)}});
  const named=BOT_AL[e.id]&&BOT_AL[e.id].test(t);

  if(PREG_ONLY.has(e.id)){if(ctx.preg&&m.length)s+=3;else if(!named&&!(ctx.preg))s*=0.2;else if(!named&&!m.length)s=0}

  if(e.id==='postnatal-depression'){if(ctx.postnatal&&m.length)s+=4;else if(!named&&!ctx.postnatal)s*=0.2;else if(!named&&!m.length)s=0}

 });

}
function fitLabel(r){

function renderAnswer(a){
 const {hit,flags,res}=a;let html='';
 if(flags.some(f=>f.only)){const f=flags.find(f=>f.only);return `<div class="flag emergency" role="alert"><b>${esc(f.t)}</b><p>${esc(f.x)}</p></div><p>I'm glad you said something. Reaching out to one of those services, or to someone you trust, is a good next step. Once you feel safer, I can also help you work out what else may be going on, and how to talk to a doctor about it.</p>`}
 const order={emergency:0,urgent:1,soon:2};
 flags.sort((x,y)=>order[x.lvl]-order[y.lvl]);
 const seen=new Set();
 flags.forEach(f=>{if(seen.has(f.t))return;seen.add(f.t);html+=`<div class="flag ${f.lvl}" role="alert"><b>${esc(f.t)}</b><p>${esc(f.x)}</p></div>`});

 let shown=res.filter(r=>(r.s>=2&&r.s>=topS*0.45)||r.named).slice(0,5);
 if(hit.filter(k=>k!=='any_pain').length<2&&topS<4&&!res.some(r=>r.named))shown=[];

 if(labels.length){html+=`<p class="bot-note">What I picked up: ${labels.map(l=>`<span class="meta">${esc(l)}</span>`).join(' ')}</p>`}
 if(!hit.length&&!shown.length){
  html+=`<p>I couldn't pick out specific symptoms from that. Try describing what you feel in your own words, for example <i>"very heavy periods and I'm always tired"</i> or <i>"burning when I wee and needing to go all the time"</i>. You can also tell me how long it has been going on.</p>`;
  return html;
 }
 if(shown.length){
  html+=`<p>Here are some things that could fit. This is not a diagnosis. Lots of conditions share symptoms, and I can't examine you or run tests.</p><div class="list">`;
  shown.forEach(r=>{
   const sup=SUPPS.filter(s=>s.forIds.includes(r.e.id)).length;
   html+=`<div class="row res"><a class="t" href="#/entry/${r.e.id}">${esc(r.e.name)}</a><span class="s">${esc(r.e.short)}</span>

   ${r.m.length?`<span class="s why">Matches: ${r.m.map(k=>esc(SYML[k]||k)).join(', ')}</span>`:''}
   <span class="s"><a href="#/entry/${r.e.id}">Read the full guide</a>${sup?` · <a href="#/supps/${r.e.id}">Supplement information (${sup})</a>`:''}</span></div>`;
  });
  html+=`</div>`;
 } else {
  html+=`<p>That's not quite enough to point towards anything specific. Tell me more, such as how long it has lasted, whether you're still having periods, and anything that makes it better or worse.</p>`;
 }
 const top=shown[0];
 html+=`<div class="care"><b>What to do next</b><ul>
 <li>Speaking to a GP, nurse or pharmacist is the best way to find out what's going on. Many of these things are common and treatable.</li>
 <li>If you feel nervous about going, you can ask for a female clinician, bring someone with you, write your symptoms down, or ask for a longer appointment. Use the summary below to help.</li>

 html+=prepBlock(a,shown);

}
function prepBlock(a,shown){

 if(!labels.length)return '';
 const qs=[];shown.slice(0,3).forEach(r=>{(r.e.ask||[]).slice(0,1).forEach(q=>qs.push(q))});
 const mine=chat.filter(c=>c.r==='u').map(c=>c.t).join(' / ');

 ask:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg>',

};
function tabs(){
 const h=location.hash||'#/';
 const cur=h.startsWith('#/browse')||h.startsWith('#/area')?'browse':h.startsWith('#/ask')?'ask':h.startsWith('#/supps')?'supps':(h.startsWith('#/saved')||h.startsWith('#/me'))?'me':'home';
 const t=(k,href,label,ic)=>`<button class="tab" ${cur===k?'aria-current="page"':''} onclick="location.hash='${href}'">${ic}<span>${label}</span></button>`;
 $('#tabs').innerHTML=`<nav class="tabs" aria-label="Main"><div class="in">${t('home','#/','Home',ICON.home)}${t('browse','#/browse','A to Z',ICON.az)}${t('ask','#/ask','Ask',ICON.ask)}${t('supps','#/supps','Supplements',ICON.pill)}${t('me','#/me','Me',ICON.me)}</div></nav>`;
}
function route(){
 if(!profile){viewOnboarding();return}
 const h=location.hash||'#/';
 const [, a, b]=h.split('/');
 if(a==='entry')viewEntry(b);
 else if(a==='tag')viewTag(decodeURIComponent(b||''));
 else if(a==='area')viewBrowse(b);
 else if(a==='ask')viewAsk();
 else if(a==='supps')viewSupps(b||null);
 else if(a==='browse')viewBrowse();
 else if(a==='saved')viewSaved();
 else if(a==='me')viewMe();
 else viewHome();
 tabs();
 if(a!=='')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
